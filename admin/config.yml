backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "barbers"
    label: "Barber Photos"
    files:
      - name: "all_photos"
        label: "All Barber Photos"
        file: "data/barbers.json"
        fields:
          - name: omar
            label: "Omar"
            widget: object
            fields:
              - name: photos
                label: Photos
                widget: list
                field:
                  name: photo
                  label: Photo URL
                  widget: string
                  hint: "Paste a photo URL from postimg.cc or upload below"

          - name: arsen
            label: "Arsen"
            widget: object
            fields:
